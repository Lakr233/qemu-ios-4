name: iPhone 3G checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential libfdt-dev libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3-venv
      - name: Create Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --requirement scripts/ios/requirements.txt
      - name: Configure QEMU
        run: |
          ./configure \
            --target-list=arm-softmmu \
            --disable-docs \
            --disable-werror \
            --python="$PWD/.venv/bin/python"
      - name: Build and test iPhone 3G
        run: make -C build iphone3g-test
